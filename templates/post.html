{% extends "layout.html" %}
{% block content %}
<!-- Page Header-->
{% set fname = 'img/' + post.img_file %}
<header class="masthead" style="background-image: url('{{ url_for('static', filename=fname) }}')">
    <div class="container position-relative px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <div class="post-heading">
                    <h1>{{ post.title }}</h1>
                    <span class="meta">
                        Posted by <a href="#!">Persona Unveil</a> on {{ post.date }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</header>
<div class="container px-4 px-lg-5">
    
</div>



<main class="mb-4">
            <div class="container px-4 px-lg-5">
                <div class="row gx-4 gx-lg-5 justify-content-center">
                    <div class="col-md-10 col-lg-8 col-xl-7">
                        <div> <a href="/post">
                            <button type="button" class="btn btn-danger rounded">Back</button>
                            </a>
                        </div>
                        <div style="white-space: pre-wrap;">
                            {{ post.content | safe }}
                        </div>
                     </div>
                </div>
            </div>
 </main>
{% endblock %}
