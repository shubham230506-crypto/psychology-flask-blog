<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="blueBook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F4E8C"/>
      <stop offset="100%" stop-color="#163A69"/>
    </linearGradient>

    <linearGradient id="greenBook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A9D8F"/>
      <stop offset="100%" stop-color="#1F6F66"/>
    </linearGradient>

    <linearGradient id="yellowBook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#D9981F"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#ffffff"/>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="520" rx="210" ry="20" fill="#D8D8D8"/>

  <!-- Standing Book -->
  <g filter="url(#shadow)">
    <rect x="140" y="170" width="70" height="310" rx="10"
          fill="url(#blueBook)" stroke="#10263F" stroke-width="4"/>
    <line x1="155" y1="195" x2="195" y2="195"
          stroke="#F6C343" stroke-width="5"/>
    <line x1="155" y1="455" x2="195" y2="455"
          stroke="#F6C343" stroke-width="5"/>
  </g>

  <!-- Green Standing Book -->
  <g filter="url(#shadow)">
    <rect x="220" y="130" width="85" height="350" rx="10"
          fill="url(#greenBook)" stroke="#103D3B" stroke-width="4"/>
    <line x1="235" y1="165" x2="290" y2="165"
          stroke="#F7D154" stroke-width="5"/>
    <line x1="235" y1="445" x2="290" y2="445"
          stroke="#F7D154" stroke-width="5"/>
  </g>

  <!-- Bottom Book -->
  <g filter="url(#shadow)">
    <rect x="280" y="410" width="350" height="70" rx="10"
          fill="url(#blueBook)" stroke="#10263F" stroke-width="4"/>
    <rect x="590" y="420" width="35" height="50" fill="#FFF5E6"/>
    <line x1="605" y1="420" x2="605" y2="470"
          stroke="#DDD" stroke-width="2"/>
  </g>

  <!-- Red Book -->
  <g filter="url(#shadow)">
    <rect x="300" y="350" width="320" height="60" rx="8"
          fill="#B73939" stroke="#7C1F1F" stroke-width="4"/>
    <rect x="300" y="355" width="300" height="50"
          fill="#FFF7EA"/>
    <rect x="455" y="350" width="18" height="80"
          fill="#D43B3B"/>
  </g>

  <!-- Yellow Book -->
  <g filter="url(#shadow)">
    <rect x="340" y="290" width="270" height="60" rx="8"
          fill="url(#yellowBook)" stroke="#9B6B08" stroke-width="4"/>
    <rect x="570" y="298" width="35" height="45"
          fill="#FFF5E6"/>
  </g>

  <!-- Green Book -->
  <g filter="url(#shadow)">
    <rect x="360" y="235" width="250" height="55" rx="8"
          fill="url(#greenBook)" stroke="#103D3B" stroke-width="4"/>
    <rect x="575" y="242" width="30" height="40"
          fill="#FFF5E6"/>
  </g>

  <!-- Open Book -->
  <g filter="url(#shadow)">
    <path d="M310 205
             Q405 160 500 205
             L500 245
             Q405 205 310 245 Z"
          fill="#FFF7E8"
          stroke="#1A2A3A"
          stroke-width="4"/>

    <path d="M500 205
             Q595 160 690 205
             L690 245
             Q595 205 500 245 Z"
          fill="#FFF7E8"
          stroke="#1A2A3A"
          stroke-width="4"/>

    <line x1="500" y1="205" x2="500" y2="245"
          stroke="#D7C7A0"
          stroke-width="2"/>

    <path d="M335 218 Q405 195 480 220"
          fill="none"
          stroke="#CBB98D"
          stroke-width="2"/>

    <path d="M520 220 Q595 195 665 218"
          fill="none"
          stroke="#CBB98D"
          stroke-width="2"/>
  </g>

  <!-- Leaves -->
  <g stroke="#25695D" stroke-width="3" fill="#4FAE91">
    <path d="M675 315
             C690 295 705 300 710 320
             C695 330 680 328 675 315Z"/>
    <path d="M700 350
             C715 330 730 335 735 355
             C720 365 705 363 700 350Z"/>
    <line x1="705" y1="310" x2="715" y2="380"/>
  </g>

  <!-- Decorative Dots -->
  <circle cx="620" cy="120" r="5" fill="#F4B942"/>
  <circle cx="150" cy="120" r="5" fill="#2A9D8F"/>
  <circle cx="520" cy="90" r="6" fill="#163A69"/>
  <circle cx="690" cy="170" r="5" fill="#163A69"/>

</svg>